name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/siloscope-linux-$arch" .
          done
          cp deploy/siloscope.service deploy/siloscope.env.example dist/

      # The Silo plugin is its own module: the plugin SDK needs a newer Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: silo-plugin/go.mod
          cache-dependency-path: silo-plugin/go.sum

      - name: Test and build the Silo plugin
        working-directory: silo-plugin
        run: |
          go test ./...
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "../dist/siloscope-silo-plugin-linux-$arch" .
          done

      - name: Checksums
        run: (cd dist && sha256sum siloscope-linux-* siloscope-silo-plugin-linux-* > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
