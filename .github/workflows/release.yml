name: Release

# Every merge to main is released by neilmc78/release-on-merge: the next
# patch version by default, or the next minor or major one when the pull
# request's title says [minor] or [major]. The release, its binaries and
# Silo plugin, and the :latest image all carry that version. Merges that only touch docs, tests or workflows
# make no release; run this workflow by hand to release them anyway.
#
# A tag pushed with the workflow's own token does not trigger other
# workflows, so this calls the binary and image builds itself.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Two quick merges are released one after the other, never with one version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: release
        uses: neilmc78/release-on-merge@v1
        with:
          components: |
            silo-plugin: Silo plugin
          extra-notes: |
            Re-upload the Silo plugin (Admin → Integrations → Plugins) only when it says updated above.

            **Docker:** `ghcr.io/${{ github.repository_owner }}/silo-monitor:latest`

  binaries:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  container:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
